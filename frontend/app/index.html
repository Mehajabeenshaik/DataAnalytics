<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DaAna — Analyst</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e8e8ef;
      background: #0e0e16;
      --accent: #7c5cfc;
      --accent-dim: #7c5cfc44;
    }
    body { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    h1 { color: var(--accent); margin-bottom: 4px; }
    .sub { color: #9aa; margin-bottom: 20px; }
    .card { background: #161622; border: 1px solid #2a2a3a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    button, .btn { background: var(--accent); color: white; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type=text], input[type=file] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0e0e16; color: #eee; box-sizing: border-box; }
    input[type=file] { width: auto; }
    label { display: block; margin-top: 8px; font-size: 13px; color: #c8c8d8; }
    #log { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    #log .row { margin-bottom: 14px; }
    .meta { color: #8d8; font-size: 12px; margin-top: 8px; }
    .err { color: #f88; }
    .ok { color: #8d8; }
    .answer { font-size: 16px; line-height: 1.5; }
    .caveat { color: #f5a623; font-size: 13px; }
    .confidence { font-weight: 600; display: inline-block; padding: 2px 8px; border-radius: 4px; margin-top: 8px; font-size: 12px; }
    .confidence.high { background: rgba(52,211,153,.15); color: #34d399; }
    .confidence.low { background: rgba(251,191,36,.15); color: #fbbf24; }
    .confidence.medium { background: rgba(96,165,250,.15); color: #60a5fa; }
    .confidence.n_a { background: rgba(140,140,154,.15); color: #8c8c9a; }
    fieldset { border: 1px solid #2a2a3a; border-radius: 8px; margin-top: 8px; }
    fieldset legend { color: #9aa; font-size: 12px; padding: 0 6px; }
    label.small { font-size: 11px; color: #7a7a8a; }
    p.small { font-size: 12px; }

    /* Typing indicator (three bouncing dots) */
    .typing { display: inline-flex; gap: 3px; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: #888;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* Charts */
    .chart-wrap { margin: 10px 0; }
    .chart-bar-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 12px; }
    .chart-bar-label { min-width: 90px; text-align: right; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chart-bar-track { flex: 1; height: 16px; border-radius: 3px; background: #1a1a24; overflow: hidden; }
    .chart-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
    .chart-bar-val { min-width: 40px; text-align: right; color: #888; font-size: 11px; }
    .line-chart-wrap { margin: 10px 0; }

    /* Tables */
    table.da-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
    table.da-table th, table.da-table td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; }
    table.da-table th { color: #5ce1e6; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .3px; }
    table.da-table td { color: #ccc; }

    /* Insights */
    .insight { background: #0e0e16; border: 1Px solid #2a2a3a; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .insight .title { font-weight: 600; font-size: 13px; color: #e0e0f0; }
    .insight .detail { font-size: 12px; color: #aaa; margin-top: 4px; }
    .insight.notice .title { color: #fbbf24; }

    /* Section headers */
    .section-title { font-weight: 600; font-size: 14px; color: #d0d0e0; margin: 12px 0 6px; }
    .summary-block { font-size: 14px; line-height: 1.5; }
    .summary-block strong { color: #fff; }

    /* Lineage */
    .lineage { font-size: 12px; color: #9aa; margin-top: 8px; }
    .lineage .tools { color: #5ce1e6; }

    /* Scroll */
    #log { max-height: 70vh; overflow-y: auto; }

    fieldset { border: 1px solid #2a2a3a; border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>DaAna</h1>
  <p class="sub">Governed analytics — API at <code id="apiBaseLabel">http://127.0.0.1:8001</code></p>

  <div class="card">
    <label>API base <input id="apiBase" type="text" value="http://127.0.0.1:8001" /></label>
    <label>API key <input id="apiKey" type="text" value="ak_demo_key_12345" /></label>
    <p style="margin-top:12px">
      <input type="file" id="file" accept=".csv,.tsv,.xlsx,.xls,.json,.parquet,.pq" />
      <button id="uploadBtn">Upload</button>
    </p>
    <p id="uploadStatus" class="meta"></p>
  </div>

  <div class="card">
    <label>Session <span id="sessionId" class="meta">— none —</span></label>
    <p class="small" id="sessionMeta"></p>
    <label>Question <input id="question" type="text" placeholder="What is total sales?" disabled /></label>
    <p style="margin-top:12px"><button id="askBtn" disabled>Ask</button></p>
  </div>

  <div class="card">
    <div id="log">Upload a CSV, then ask a question.</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    let uploaded = false;

    function headers(extra) {
      return Object.assign({ "X-API-Key": $("apiKey").value.trim() }, extra || {});
    }
    function base() {
      return $("apiBase").value.replace(/\/$/, "");
    }
    function setUploadState(ok, msg) {
      $("uploadStatus").textContent = msg;
      $("uploadStatus").className = "meta " + (ok ? "ok" : "err");
    }

    function escapeHtml(s) {
      if (s == null) return "";
      const el = document.createElement("div");
      el.appendChild(document.createTextNode(String(s)));
      return el.innerHTML;
    }

    // Convert light markdown (bold **x**, newlines) used by the backend into HTML.
    function mdToHtml(s) {
      return escapeHtml(String(s))
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function fmtNum(v) {
      if (typeof v === "number") {
        return v % 1 === 0 ? v.toLocaleString() : v.toFixed(2);
      }
      return escapeHtml(String(v ?? ""));
    }

    // ── Light Vega-Lite SVG rendering (no charting dependency) ───────────────
    function renderChartHtml(spec) {
      if (!spec || typeof spec !== "object") return "";
      const values = spec.data && spec.data.values;
      if (!Array.isArray(values) || !values.length) return "";
      const mark = spec.mark || "";
      const note = spec._note ? `<p class="meta">${escapeHtml(spec._note)}</p>` : "";

      if (mark === "bar") {
        const max = Math.max(...values.map(v => Number(v.value) || 0), 1);
        let rows = "";
        values.slice(0, 50).forEach(v => {
          const pct = Math.round((Number(v.value) / max) * 100);
          rows += `<div class="chart-bar-row">` +
            `<span class="chart-bar-label" title="${escapeHtml(v.category)}">${escapeHtml(String(v.category).slice(0, 18))}</span>` +
            `<div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%"></div></div>` +
            `<span class="chart-bar-val">${fmtNum(v.value)}</span>` +
            `</div>`;
        });
        return `<div class="chart-wrap">${rows}</div>${note}`;
      }

      if (mark === "line") {
        const nums = values.map(v => Number(v.value) || 0);
        const max = Math.max(...nums, 1), min = Math.min(...nums, 0);
        const range = max - min || 1;
        const w = 320, h = 110, pad = 6;
        const pts = values.map((v, i) => {
          const x = pad + (i / Math.max(values.length - 1, 1)) * (w - 2 * pad);
          const y = h - pad - ((Number(v.value) - min) / range) * (h - 2 * pad);
          return `${x},${y}`;
        });
        let labels = "";
        values.forEach((v, i) => {
          const x = pad + (i / Math.max(values.length - 1, 1)) * (w - 2 * pad);
          if (i % Math.max(1, Math.ceil(values.length / 5)) === 0) {
            labels += `<text x="${x}" y="${h + 14}" fill="#666" font-size="9" text-anchor="middle">${escapeHtml(String(v.date).slice(0, 7))}</text>`;
          }
        });
        return `<div class="line-chart-wrap"><svg viewBox="0 0 ${w} ${h + 20}" width="100%" preserveAspectRatio="none">` +
          `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>` +
          `${values.map((v, i) => { const [x, y] = pts[i].split(","); return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`; }).join("")}` +
          labels + `</svg></div>${note}`;
      }

      if (mark === "rect") {
        const rows = [...new Set(values.map(v => String(v.row)))];
        const cols = [...new Set(values.map(v => String(v.col)))];
        const nums = values.map(v => Number(v.value) || 0);
        const max = Math.max(...nums, 1), min = Math.min(...nums, 0);
        const range = max - min || 1;
        const cell = 16, gap = 2, labelW = 30;
        const w = cols.length * (cell + gap) + labelW + 8;
        const h = rows.length * (cell + gap) + 8;
        let cells = "";
        values.forEach(v => {
          const ri = rows.indexOf(String(v.row));
          const ci = cols.indexOf(String(v.col));
          const t = (Number(v.value) - min) / range;
          const r = Math.round(20 + t * 200);
          const g = Math.round(20 + (1 - t) * 200);
          const b = Math.round(20 + t * 200);
          const x = labelW + ci * (cell + gap);
          const y = ri * (cell + gap);
          cells += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="rgb(${r},${g},${b})" rx="2"/>`;
        });
        let rowLabels = "";
        rows.forEach((r, ri) => {
          rowLabels += `<text x="2" y="${ri * (cell + gap) + cell / 2 + 4}" fill="#666" font-size="8">${escapeHtml(r.slice(0, 8))}</text>`;
        });
        return `<div class="line-chart-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none">` +
          rowLabels + cells + `</svg></div>${note}`;
      }

      return "";
    }

    // ── Render upload baseline analysis (summary + sections + insights) ─────
    function renderAnalysis(data) {
      let html = "";
      if (data.summary) {
        html += `<div class="row summary-block">${mdToHtml(data.summary)}</div>`;
      }
      if (data.sections && data.sections.length) {
        data.sections.forEach(sec => {
          html += `<div class="row"><span class="section-title">${escapeHtml(sec.title || sec.type)}</span>`;
          const data2 = sec.data;
          if (sec.type === "text" && typeof data2 === "string") {
            html += mdToHtml(data2);
          } else if (sec.type === "table" && Array.isArray(data2) && data2.length) {
            const keys = Object.keys(data2[0]);
            let t = `<table class="da-table"><thead><tr>${keys.map(k => `<th>${escapeHtml(k)}</th>`).join("")}</tr></thead><tbody>`;
            data2.slice(0, 15).forEach(row => {
              t += `<tr>${keys.map(k => `<td>${fmtNum(row[k])}</td>`).join("")}</tr>`;
            });
            t += `</tbody></table>`;
            html += t;
          } else if (sec.type === "bar_chart" && data2) {
            html += renderChartHtml({ mark: "bar", data: { values: data2.labels.map((l, i) => ({ category: l, value: data2.values[i] })) } });
          } else if (sec.type === "line_chart" && data2) {
            html += renderChartHtml({ mark: "line", data: { values: data2.labels.map((l, i) => ({ date: l, value: data2.values[i] })) } });
          }
          html += `</div>`;
        });
      }
      if (data.insights && data.insights.length) {
        html += `<div class="row"><span class="section-title">✨ Things worth knowing</span>`;
        data.insights.forEach(ins => {
          html += `<div class="insight ${ins.severity === "notice" ? "notice" : ""}">` +
            `<div class="title">${escapeHtml(ins.title || "Insight")}</div>` +
            (ins.detail ? `<div class="detail">${escapeHtml(ins.detail)}</div>` : "") +
            (ins.chart ? renderChartHtml(ins.chart) : "") +
            `</div>`;
        });
        html += `</div>`;
      }
      // File metadata summary
      if (data.rows != null || data.columns != null) {
        html += `<div class="row"><span class="section-title">Dataset</span>` +
          `<p class="small">${escapeHtml(data.filename || "file")} — ${data.rows || 0} rows × ${data.columns || 0} columns</p>` +
          `</div>`;
      }
      $("log").innerHTML = html || '<p class="meta">File uploaded.</p>';
    }

    // ── Render a full Q&A answer (answer + confidence + caveats + lineage + chart)
    function renderAnswer(data) {
      let html = '<div class="row"><div class="answer">' + mdToHtml(data.answer || data.message || "") + "</div>";
      const conf = (data.confidence || "").toString().toLowerCase();
      if (conf) {
        html += `<span class="confidence ${conf === "n/a" ? "n_a" : conf}">confidence: ${escapeHtml(conf)}</span>`;
      }
      const tools = (data.lineage && data.lineage.metrics_or_tools_used) || [];
      if (tools.length) {
        html += `<p class="lineage"><span class="tools">metrics/tools used:</span> ${escapeHtml(tools.join(", "))}</p>`;
      }
      const filters = (data.lineage && data.lineage.filters_applied) || {};
      const filterKeys = Object.keys(filters);
      if (filterKeys.length) {
        html += `<p class="lineage"><span class="tools">filters:</span> ${filterKeys.map(k => `${escapeHtml(k)} = ${escapeHtml(filters[k])}`).join(", ")}</p>`;
      }
      const notes = data.lineage && data.lineage.notes;
      if (notes) {
        html += `<p class="lineage"><span class="tools">notes:</span> ${escapeHtml(notes)}</p>`;
      }
      if (data.caveats && data.caveats.length) {
        const items = data.caveats.map(c => `<li class="caveat">${escapeHtml(c)}</li>`).join("");
        html += `<p class="caveat">Caveats:</p><ul style="margin-left:18px">${items}</ul>`;
      }
      const chartHtml = renderChartHtml(data.chart);
      if (chartHtml) html += chartHtml;
      html += `</div>`;
      appendLog(html);
    }

    function appendLog(html) {
      $("log").insertAdjacentHTML("beforeend", html);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function clearLog() {
      $("log").innerHTML = "";
    }

    function showTyping() {
      const d = document.createElement("div");
      d.id = "typingIndicator";
      d.className = "row";
      d.innerHTML = `<span class="typing"><span></span><span></span><span></span></span> <span class="meta">thinking…</span>`;
      $("log").appendChild(d);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function removeTyping() {
      const t = $("typingIndicator");
      if (t) t.remove();
    }

    async function ensureSession() {
      if (sessionId) return sessionId;
      const r = await fetch(base() + "/api/v1/session", { method: "POST", headers: headers() });
      if (!r.ok) throw new Error("session failed: " + r.status + " " + await r.text());
      const j = await r.json();
      sessionId = j.session_id || j.sessionId;
      if (!sessionId) throw new Error("no session_id in response: " + JSON.stringify(j));
      $("sessionId").textContent = sessionId.slice(0, 8) + "…";
      $("sessionId").className = "meta ok";
      $("question").disabled = false;
      clearLog();
      appendLog('<p class="meta">Session created. Upload a CSV to start.</p>');
      return sessionId;
    }

    async function fetchSessionInfo() {
      if (!sessionId) return;
      try {
        const r = await fetch(base() + "/api/v1/session/" + encodeURIComponent(sessionId), { headers: headers() });
        if (!r.ok) return;
        const j = await r.json();
        let meta = "";
        if (j.filename) meta += escapeHtml(j.filename);
        if (j.rows && j.columns) meta += ` — ${j.rows} rows × ${j.columns} columns`;
        if (j.datasets && j.datasets.length) meta += ` · datasets: ${escapeHtml(j.datasets.join(", "))}`;
        $("sessionMeta").textContent = meta;
        if (j.schema_card) {
          const el = document.createElement("div");
          el.className = "row";
          el.innerHTML = `<span class="section-title">Schema</span><pre style="font-size:11px;color:#aaa;background:#0e0e16;padding:8px;border-radius:6px;overflow-x:auto">${escapeHtml(j.schema_card)}</pre>`;
          appendLog(el.outerHTML);
        }
      } catch (e) { /* session info is best-effort */ }
    }

    $("uploadBtn").onclick = async () => {
      $("uploadBtn").disabled = true;
      setUploadState(true, "Uploading…");
      try {
        await ensureSession();
        const f = $("file").files[0];
        if (!f) throw new Error("choose a file");
        const fd = new FormData();
        fd.append("file", f);
        fd.append("session_id", sessionId);
        const r = await fetch(base() + "/api/v1/upload", { method: "POST", headers: headers(), body: fd });
        const text = await r.text();
        if (!r.ok) {
          if (/utf-?8|encoding|codec|decode|ascii|unicode/i.test(text || "")) {
            throw new Error("This file is not UTF-8. Re-save as CSV UTF-8 in Excel and try again.");
          }
          throw new Error("Upload failed (" + r.status + "): " + (text || "unknown error"));
        }
        uploaded = true;
        setUploadState(true, "Upload OK — " + f.name);
        let j;
        try { j = JSON.parse(text); } catch { j = { filename: f.name }; }
        if (j.session_id && j.session_id !== sessionId) sessionId = j.session_id;
        $("sessionId").textContent = sessionId.slice(0, 8) + "…";
        renderAnalysis(j);
        await fetchSessionInfo();
        $("askBtn").disabled = false;
      } catch (e) {
        setUploadState(false, String(e.message || e));
      } finally {
        $("uploadBtn").disabled = false;
      }
    };

    // ── SSE streaming ask (fetch + ReadableStream, since EventSource can't set X-API-Key)
    async function askQuestionStream(text, { onChunk, onFinal, onError }) {
      const res = await fetch(base() + "/api/v1/ask/stream", {
        method: "POST",
        headers: { ...headers(), "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question: text }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || "Request failed");
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split("\n\n");
        buffer = events.pop();
        for (const evt of events) {
          const line = evt.trim();
          if (!line.startsWith("data:")) continue;
          let payload;
          try { payload = JSON.parse(line.slice(5).trim()); } catch { continue; }
          if (payload.type === "chunk") {
            onChunk(payload.text || "");
          } else if (payload.type === "final") {
            onFinal(payload.data || {});
          } else if (payload.type === "error") {
            onError(payload.message || "Streaming error");
          }
        }
      }
    }

    $("askBtn").onclick = async () => {
      const q = $("question").value.trim();
      if (!q) return;
      if (!uploaded) {
        clearLog();
        appendLog('<p class="err">Upload a file first.</p>');
        return;
      }
      $("askBtn").disabled = true;
      $("question").disabled = true;
      clearLog();
      showTyping();
      const botMsg = document.createElement("div");
      botMsg.className = "row";
      botMsg.id = "currentAnswer";
      let streamedText = "";
      $("log").appendChild(botMsg);

      try {
        await askQuestionStream(q, {
          onChunk: (chunk) => {
            removeTyping();
            streamedText += chunk;
            botMsg.innerHTML = '<div class="answer">' + mdToHtml(streamedText) + "</div>";
            $("log").scrollTop = $("log").scrollHeight;
          },
          onFinal: (data) => {
            removeTyping();
            botMsg.innerHTML = "";
            botMsg.removeAttribute("id");
            const wrap = document.createElement("div");
            wrap.className = "row";
            wrap.innerHTML = answerHtml(data);
            $("log").appendChild(wrap);
            $("log").scrollTop = $("log").scrollHeight;
          },
          onError: (msg) => {
            removeTyping();
            botMsg.innerHTML = '<p class="err">❌ ' + escapeHtml(msg) + "</p>";
          },
        });
      } catch (e) {
        removeTyping();
        // Fallback: blocking /api/v1/ask
        try {
          const r = await fetch(base() + "/api/v1/ask", {
            method: "POST",
            headers: { ...headers(), "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, question: q }),
          });
          const text = await r.text();
          if (!r.ok) throw new Error("Ask failed (" + r.status + "): " + (text || "unknown error"));
          let j;
          try { j = JSON.parse(text); } catch { j = { answer: text, confidence: "" }; }
          botMsg.innerHTML = "";
          botMsg.removeAttribute("id");
          botMsg.className = "row";
          botMsg.innerHTML = answerHtml(j);
          $("log").scrollTop = $("log").scrollHeight;
        } catch (e2) {
          botMsg.innerHTML = '<p class="err">❌ ' + escapeHtml(e2.message || e2) + "</p>";
        }
      } finally {
        $("askBtn").disabled = false;
        $("question").disabled = false;
        $("question").value = "";
        $("question").focus();
      }
    };

    // Build full answer HTML (answer + confidence + caveats + lineage + chart)
    function answerHtml(data) {
      let html = '<div class="answer">' + mdToHtml(data.answer || data.message || data.text || "") + "</div>";
      const conf = (data.confidence || "").toString().toLowerCase();
      if (conf) {
        html += `<span class="confidence ${conf === "n/a" ? "n_a" : conf}">confidence: ${escapeHtml(conf)}</span>`;
      }
      const tools = (data.lineage && data.lineage.metrics_or_tools_used) || [];
      if (tools.length) {
        html += `<p class="lineage"><span class="tools">metrics/tools used:</span> ${escapeHtml(tools.join(", "))}</p>`;
      }
      const filters = (data.lineage && data.lineage.filters_applied) || {};
      const filterKeys = Object.keys(filters);
      if (filterKeys.length) {
        html += `<p class="lineage"><span class="tools">filters:</span> ${filterKeys.map(k => `${escapeHtml(k)} = ${escapeHtml(filters[k])}`).join(", ")}</p>`;
      }
      const notes = data.lineage && data.lineage.notes;
      if (notes) {
        html += `<p class="lineage"><span class="tools">notes:</span> ${escapeHtml(notes)}</p>`;
      }
      if (data.caveats && data.caveats.length) {
        const items = data.caveats.map(c => `<li class="caveat">${escapeHtml(c)}</li>`).join("");
        html += `<p class="caveat">Caveats:</p><ul style="margin-left:18px">${items}</ul>`;
      }
      const chartHtml = renderChartHtml(data.chart);
      if (chartHtml) html += chartHtml;
      return html;
    }
  </script>
</body>
</html>
