 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DaAna — Analyst</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e8e8ef; background: #0e0e16; }
    body { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #7c5cfc; margin-bottom: 4px; }
    .sub { color: #9aa; margin-bottom: 20px; }
    .card { background: #161622; border: 1px solid #2a2a3a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    button, .btn { background: #7c5cfc; color: white; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type=text] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0e0e16; color: #eee; box-sizing: border-box; }
    #log { white-space: pre-wrap; font-size: 14px; line-height: 1.45; }
    .meta { color: #8d8; font-size: 12px; margin-top: 8px; }
    .err { color: #f88; }
    .ok { color: #8d8; }
    .answer { font-size: 16px; line-height: 1.5; }
    .caveat { color: #f5a623; font-size: 13px; }
    .confidence { font-weight: 600; }
    .confidence.high { color: #34d399; }
    .confidence.low { color: #f5a623; }
    .confidence.medium { color: #60a5fa; }
    fieldset { border: 1px solid #2a2a3a; border-radius: 8px; margin-top: 8px; }
    fieldset legend { color: #9aa; font-size: 12px; padding: 0 6px; }
  </style>
</head>
<body>
  <h1>DaAna</h1>
  <p class="sub">Governed analytics — API at <code id="apiBaseLabel">http://127.0.0.1:8001</code></p>

  <div class="card">
    <label>API base <input id="apiBase" type="text" value="http://127.0.0.1:8001" /></label>
    <label style="display:block;margin-top:8px">API key <input id="apiKey" type="text" value="ak_demo_key_12345" /></label>
    <p style="margin-top:12px">
      <input type="file" id="file" accept=".csv,.xlsx,.json,.parquet" />
      <button id="uploadBtn">Upload</button>
    </p>
    <p id="uploadStatus" class="meta"></p>
  </div>

  <div class="card">
    <label>Session <span id="sessionId" class="meta">— none —</span></label>
    <input id="question" type="text" placeholder="What is total sales?" disabled />
    <p style="margin-top:12px"><button id="askBtn" disabled>Ask</button></p>
  </div>

  <div class="card">
    <div id="log">Upload a CSV, then ask a question.</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let uploaded = false;
let uploadedFilename = null;

function headers() {
  return { "X-API-Key": $("apiKey").value.trim() };
}
function base() {
  return $("apiBase").value.replace(/\/$/, "");
}

function setUploadState(ok, msg) {
  $("uploadStatus").textContent = msg;
  $("uploadStatus").className = "meta " + (ok ? "ok" : "err");
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch(base() + "/api/v1/session", { method: "POST", headers: headers() });
  if (!r.ok) throw new Error("session failed: " + r.status + " " + await r.text());
  const j = await r.json();
  sessionId = j.session_id || j.sessionId;
  if (!sessionId) throw new Error("no session_id in response: " + JSON.stringify(j));
  $("sessionId").textContent = sessionId.slice(0, 8) + "…";
  $("sessionId").className = "meta ok";
  $("question").disabled = false;
  return sessionId;
}

function isUtf8Error(text) {
  return /utf-?8|encoding|codec|decode|ascii|unicode/i.test(text || "");
}

function renderAnswer(j) {
  const answer = j.answer || j.message || "";
  const conf = (j.confidence || "").toString().toLowerCase();
  const caveats = j.caveats || [];
  const lineage = j.lineage || {};
  const tools = lineage.metrics_or_tools_used || [];

  let html = '<div class="answer">' + escapeHtml(answer) + "</div>";

  if (conf) {
    html += '<p style="margin-top:12px"><span class="confidence ' + conf + '">confidence: ' + escapeHtml(conf) + "</span></p>";
  }

  if (tools.length) {
    html += '<p style="margin-top:8px" class="meta">metrics/tools used: ' + escapeHtml(tools.join(", ")) + "</p>";
  }

  if (caveats.length) {
    const items = caveats.map(c => '<li class="caveat">' + escapeHtml(c) + "</li>").join("");
    html += '<p style="margin-top:8px" class="caveat">Caveats:</p><ul style="margin-left:18px">' + items + "</ul>";
  }

  $("log").innerHTML = html;
}

function escapeHtml(s) {
  var el = document.createElement("div");
  el.appendChild(document.createTextNode(String(s)));
  return el.innerHTML;
}

$("uploadBtn").onclick = async () => {
  $("uploadBtn").disabled = true;
  setUploadState(true, "Uploading…");
  try {
    await ensureSession();
    const f = $("file").files[0];
    if (!f) throw new Error("choose a file");
    const fd = new FormData();
    fd.append("file", f);
    fd.append("session_id", sessionId);
    const r = await fetch(base() + "/api/v1/upload", { method: "POST", headers: headers(), body: fd });
    const text = await r.text();
    if (!r.ok) {
      if (isUtf8Error(text)) {
        throw new Error("This file is not UTF-8. Re-save as CSV UTF-8 in Excel and try again.");
      }
      throw new Error("Upload failed (" + r.status + "): " + (text || "unknown error"));
    }
    uploaded = true;
    uploadedFilename = f.name;
    $("uploadStatus").textContent = "Upload OK — " + f.name;
    $("uploadStatus").className = "meta ok";
    $("log").textContent = "File uploaded. Ask a question below.";
    $("askBtn").disabled = false;
  } catch (e) {
    setUploadState(false, String(e.message || e));
  } finally {
    $("uploadBtn").disabled = false;
  }
};

$("askBtn").onclick = async () => {
  const q = $("question").value.trim();
  if (!q) return;
  if (!uploaded) {
    $("log").innerHTML = '<p class="err">Upload a file first.</p>';
    return;
  }
  $("askBtn").disabled = true;
  $("log").textContent = "Thinking…";
  try {
    const r = await fetch(base() + "/api/v1/ask", {
      method: "POST",
      headers: { ...headers(), "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, question: q }),
    });
    const text = await r.text();
    if (!r.ok) {
      throw new Error("Ask failed (" + r.status + "): " + (text || "unknown error"));
    }
    let j;
    try { j = JSON.parse(text); } catch { j = { answer: text, confidence: "" }; }
    if (!j.answer) {
      j.answer = j.message || j.text || text;
    }
    renderAnswer(j);
  } catch (e) {
    $("log").innerHTML = '<p class="err">Error: ' + escapeHtml(e.message || e) + "</p>";
  } finally {
    $("askBtn").disabled = false;
  }
};
</script>
</body>
</html>
